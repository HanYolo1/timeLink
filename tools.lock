# The build tools the timeLink Builders need, which are not in timeLink's releases: windows-x64 for the Windows builder,
# linux-x64 for the Linux one (its AppImage carries only the builder and its Python). The Windows builder's setup, the Linux
# AppImage's first start (builder/linux/linux_tools.py) and the timeLink Launcher download each one they lack, check its
# SHA-256 and size, and unpack it into the install; a tool another installed version has is taken from it, not downloaded
# again (docs/releases.md, "tools.lock"). A change is a pull request that edits this file; scripts/tools.py checks it,
# mirrors an upstream archive, and assembles and uploads ours (RELEASING.md, "Bump a tool"). The Linux lines are ours,
# made by scripts/linux/deps.sh tools from its pinned downloads.
#
#   tool <name> <version> <system> <sha256> <size> <dest> <prefix> <url> [<url> ...]
#
# dest: the folder the tool becomes in a builder install (Windows: under timeLinkBuilder/tools; Linux: beside the AppImage's
# usr/share/timeLink, where the AppImage had them). prefix: the folder inside the archive that becomes dest ("-": the whole
# archive). A Linux archive keeps its files' modes and its relative links.
#
# The URLs are tried in order: first timeLink's own copy, an asset of the `tools` release of HanYolo1/timeLink-tools, a
# public repository that holds nothing but these archives
# (https://github.com/HanYolo1/timeLink-tools/releases/download/tools/<sha256>-<name>.zip), then, for llvm-mingw only, its
# maker's own release as the fallback. Every other archive's timeLink copy is the only one a line names: no other project's
# releases are listed. A release asset's name carries its SHA-256, and the line checks it, so a replaced asset is caught;
# never reuse a version string.
#
# (Every archive was checked against its SHA-256 and size when it was copied to timeLink-tools. python, emsdk and
# wgpu-native were then repacked there with their top folder renamed to timeLinkBuilder, every file unchanged, by its
# scripts/rename_top_folder.py, which checks that the two trees are identical.)
#
# Where they came from: python, emsdk and wgpu-native are the vendors' Windows builds, as the builder before the fork
# packaged them; cpm is that builder's CPM cache with dav1d added (scripts/windows/dav1d.sh). third-party is the prebuilt
# files of NotRexed's Hookshot v2.1.0 builder's third_party part (tools.py assemble), built from the GPL sources in this
# repository's third_party/ (each part's PROVENANCE.md says where it came from and under which licence). The linux-x64 lines: scripts/linux/deps.sh tools (LLVM 23.1.5's clang and lld;
# FFmpeg with dav1d; SDL2; the Vulkan, SPIR-V and VMA headers; Ubuntu 22.04's glibc 2.35 sysroot). No play profile:
# play profiles are committed in assets/profiles/, not tools here.
