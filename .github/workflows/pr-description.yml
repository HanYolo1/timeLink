# A pull request's description must follow the template (.github/pull_request_template.md, CONTRIBUTING.md "Commits and
# pull requests"): the status line, every section filled in, the measurements named by commit, every "Everyone" box
# ticked (the rules: the opening comment of scripts/check_pr_description.py).
# A PR in progress (a draft, or WIP: or [WIP] at the start of the title) passes with a notice: it is checked once it
# is marked ready. Only the description is read, from the API, with main's script: the pull request's code is never
# checked out, so pull_request_target, which also runs for pull requests from forks, is safe. No game data is involved.
#
# `ready_for_review` is not one of the events: GitHub sends it when a draft is marked ready, but it does not send
# `edited` with it, so a PR whose readiness is taken from the title alone is covered by `edited`, and a draft's check
# runs again on the next push or edit.
name: PR description

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  description:
    name: Description follows the template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check_pr_description.py
            .github/pull_request_template.md
            tests
          sparse-checkout-cone-mode: false
      - name: Check the description
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 -I scripts/check_pr_description.py --pr "$PR_NUMBER"
          --repo "${{ github.repository }}" --server "${{ github.server_url }}"
