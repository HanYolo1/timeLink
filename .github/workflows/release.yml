# timeLink's releases (docs/releases.md; how to make one: RELEASING.md). One release, one tag, both products: the builders
# (build-linux.yml, build-windows.yml) and the launcher (build-launcher.yml). What tells a product's releases apart is the
# files they carry, not the tag (launcher/Core/ReleaseManifest.cs, Ships).
#
#   a push to main       the nightly: nightly-<commits since the fork>-<commit>, a pre-release
#   a tag vX.Y.Z-rc.N    a release candidate, a pre-release (the rc channel)
#   a tag vX.Y.Z         a stable (the stable channel, and rc too). Both products' first is v0.1.0
#
# 1. version: tools.lock is checked first (scripts/tools.py check --require: every tool the Windows and the Linux builder
#    need is in timeLink's packages), then the version's name; a tag is checked too (scripts/release.py check-tag: its form, on main, above
#    every release, and as high as the commits since the last stable call for). Either refused builds nothing.
#    A tag whose commit CI has released already (its nightly; for a stable, its release candidate) names that release in
#    `checked` (scripts/release.py released-as: published, its SHA256SUMS signed by a key the launcher trusts and naming its
#    every file; one that is not stops the run). Its run passed every check of the commit, so the build checks that ship
#    no file are not run again. Its files are not reused: each carries its version (the AppImage's VERSION, the zip's
#    VERSION and builder), and a release never ships a file that names another version.
# 2. linux, windows, launcher: timeLink-<v>-x86_64.AppImage, timeLinkBuilder-<v>-windows-x64.zip, and the launcher's
#    timeLinkLauncher-<v>-windows-x64-setup.exe, -windows-x64-portable.zip and -x86_64.AppImage.
# 3. publish: SHA256SUMS over every file and tools.lock, SHA256SUMS.sig (the release key), the notes (git-cliff, cliff.toml),
#    then a draft release with every file, published last: until then no launcher sees it. A nightly also prunes the
#    nightlies past the newest 5. Nothing is committed back to the repository.
#
# Secret (RELEASING.md, One-time setup): RELEASE_SIGNING_KEY (the release key's private PEM). Releases are made with the job's
# own token (github.token, passed to scripts/release.py as RELEASE_TOKEN; no secret to create, no bot account): the
# `permissions:` block below gives it `contents: write` on this repository and nothing else, so it may make, upload to,
# publish and delete releases and delete tags here, and nowhere else. GitHub takes a release asset up to 2 GB directly, so
# there is no separate upload address to configure (Forgejo needed one behind Cloudflare's 100 MB limit).
name: Release
on:
  push:
    branches: [main]
    tags: ['v*']

# (GitHub's GITHUB_TOKEN is read-only unless a workflow asks: `contents: write` is what makes, uploads to and publishes a
# release. Forgejo ignored this key, so it was absent; on GitHub its absence would fail the publish job.)
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      ref: ${{ steps.name.outputs.ref }}
      checked: ${{ steps.name.outputs.checked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # (the job's token stays in .git/config so the `git fetch` below can read this private repository's tags and
          # main; with it off, git asks for a username and fails: "could not read Username for 'https://github.com'")
          persist-credentials: true
      - name: The tools
        run: |
          # (every tool the Windows and the Linux builder need is in tools.lock and its packages: before any build, not
          # after both. Neither builder carries its tools: they download them by tools.lock)
          if ! python3 -I scripts/tools.py check --require; then
            echo "::error::tools.lock or its packages lack a tool a builder needs; RELEASING.md, Bump a tool"
            exit 1
          fi
      - id: name
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags origin main
          ref=$(git rev-parse HEAD)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            python3 -I scripts/release.py check-tag "$tag" --main origin/main
            # (the release CI made of this commit already, checked: its build checks are not run again; it stops here when
            # a release of this commit is not signed or not whole)
            checked=$(python3 -I scripts/release.py released-as "$ref" --not "$tag")
            echo "checked=$checked" >> "$GITHUB_OUTPUT"
            [[ -z $checked ]] || echo "::notice::$checked is this commit's release: its build checks are not run again"
          else
            # (a nightly whose commit is no longer main's skips itself: the release runs queue one at a time, and of a few
            # merges in a row only the newest one builds; the one already running goes on)
            head=$(git rev-parse origin/main)
            if [[ $GITHUB_EVENT_NAME == push && $head != "$ref" ]]; then
              echo "::notice::main has moved on to ${head:0:8}: this nightly skips, the newer one builds"
              echo "tag=" >> "$GITHUB_OUTPUT"
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag=$(python3 -I scripts/release.py nightly-name)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "$tag, from $ref"

  linux:
    name: Linux builder
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/build-linux.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.ref }}
      checked: ${{ needs.version.outputs.checked }}

  windows:
    name: Windows builder
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.ref }}
      checked: ${{ needs.version.outputs.checked }}

  launcher:
    name: Launcher
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/build-launcher.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ needs.version.outputs.ref }}

  publish:
    name: Sign and publish
    needs: [version, linux, windows, launcher]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.version.outputs.tag }}
      REF: ${{ needs.version.outputs.ref }}
      RELEASE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0
          # (as in the version job: the `git fetch` below needs the job's token to read this private repository)
          persist-credentials: true
      # (from Forgejo's public address behind Cloudflare, as the build jobs' upload: fetched once more when it failed)
      - id: download_1
        continue-on-error: true
        uses: actions/download-artifact@v4   # v4 (4.1.4 with the GHES check off)
        with:
          name: timeLink-linux-x86_64
          path: files
      - if: steps.download_1.outcome == 'failure'
        uses: actions/download-artifact@v4   # v4 (4.1.4 with the GHES check off)
        with:
          name: timeLink-linux-x86_64
          path: files
      # (from Forgejo's public address behind Cloudflare, as the build jobs' upload: fetched once more when it failed)
      - id: download_2
        continue-on-error: true
        uses: actions/download-artifact@v4   # v4 (4.1.4 with the GHES check off)
        with:
          name: timeLinkBuilder-windows
          path: files
      - if: steps.download_2.outcome == 'failure'
        uses: actions/download-artifact@v4   # v4 (4.1.4 with the GHES check off)
        with:
          name: timeLinkBuilder-windows
          path: files
      # (from Forgejo's public address behind Cloudflare, as the build jobs' upload: fetched once more when it failed)
      - id: download_3
        continue-on-error: true
        uses: actions/download-artifact@v4   # v4 (4.1.4 with the GHES check off)
        with:
          name: timeLinkLauncher
          path: files
      - if: steps.download_3.outcome == 'failure'
        uses: actions/download-artifact@v4   # v4 (4.1.4 with the GHES check off)
        with:
          name: timeLinkLauncher
          path: files
      - name: The files
        run: |
          git fetch -q --tags origin
          cp tools.lock files/
          ls -l files
          test -f "files/timeLink-$TAG-x86_64.AppImage" && test -f "files/timeLinkBuilder-$TAG-windows-x64.zip"
          test -f "files/timeLinkLauncher-$TAG-windows-x64-setup.exe" && test -f "files/timeLinkLauncher-$TAG-windows-x64-portable.zip" \
            && test -f "files/timeLinkLauncher-$TAG-x86_64.AppImage"
      - name: SHA256SUMS, signed
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ -n $KEY ]] || { echo "::error::no RELEASE_SIGNING_KEY secret (RELEASING.md, One-time setup)"; exit 1; }
          python3 -I scripts/release.py sums files/* --out files/SHA256SUMS
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          python3 -I scripts/release.py sign files/SHA256SUMS --key "$RUNNER_TEMP/key.pem" --out files/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          # (checked with the key the launcher is built with, not the one just used: a key it does not trust stops here)
          python3 -I scripts/release.py verify files/SHA256SUMS --files files
          cat files/SHA256SUMS
      - name: The notes
        run: |
          GIT_CLIFF=$(python3 -I scripts/release.py git-cliff "$RUNNER_TEMP/cliff")
          export GIT_CLIFF
          python3 -I scripts/release.py notes "$TAG" --out notes.md
          cat notes.md
      - name: Publish
        run: python3 -I scripts/release.py publish "$TAG" --target "$REF" --notes notes.md files/*
      - name: Prune the nightlies
        if: startsWith(needs.version.outputs.tag, 'nightly-')
        run: python3 -I scripts/release.py prune --keep 5
